    <script src="/max-web-app.js"></script>
    <script>
      (function() {
        // Load Telegram SDK only if launched in Telegram Mini App
        var isTg = window.location.hash.indexOf('tgWebAppData') !== -1 ||
                   window.location.search.indexOf('tgWebAppData') !== -1 ||
                   window.location.search.indexOf('platform=telegram') !== -1;
        if (isTg) {
          var s = document.createElement('script');
          s.src = '/telegram-web-app.js';
          s.defer = true;
          document.head.appendChild(s);
        }

        function triggerReady() {
          try {
            if (window.WebApp && typeof window.WebApp.ready === 'function') {
              window.WebApp.ready();
            }
            if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.ready === 'function') {
              window.Telegram.WebApp.ready();
              if (typeof window.Telegram.WebApp.expand === 'function') {
                window.Telegram.WebApp.expand();
              }
            }
          } catch (e) {
            console.warn('triggerReady error:', e);
          }
        }
        triggerReady();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', triggerReady);
        }
        window.addEventListener('load', triggerReady);
      })();
    </script>
